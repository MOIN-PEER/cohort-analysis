[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cohort-analysis"
version = "1.0.0"
description = "Cohort retention, LTV:CAC and shifted-beta-geometric forecasting for a subscription business"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Moin Peer" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "statsmodels>=0.14", "matplotlib>=3.8",
                "plotly>=5.20"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0"]

[project.scripts]
cohort-analysis = "cohort_analysis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
